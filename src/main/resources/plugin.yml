name: TabletopGame
main: com.tabletopgame.TabletopGamePlugin
version: "1.0.0-SNAPSHOT"
api: ["1.0.0"]
author: MysteriousHim
description: 桌面游戏（五子棋 / 中国象棋 / 黑白棋 / 围棋 / UNO 牌桌）
load: STARTUP
# 强依赖经济插件：缺失时 Nukkit 直接拒绝加载本插件（不会以「赌博不可用」的降级形态运行）
depend: [EconomyAPI]

commands:
  tabletopgame:
    description: 获取棋盘/牌桌物品 / 插件设置 / 重载配置
    usage: "/tabletopgame [3x3|xiangqi|othello|go9|go13|go19|go19big|uno|settings|reload]"
    permission: tabletopgame.command

permissions:
  tabletopgame.command:
    description: 允许使用 /tabletopgame 命令（发放棋盘/牌桌物品 / 插件设置 / 重载配置）
    default: op